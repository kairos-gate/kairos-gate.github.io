<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#F5F0E6;--card:#FFFFFF;--ink:#1E2A26;--muted:#6B7570;--green:#0C5F45;--green2:#0E7A57;--line:#E3DCCB;

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 2px}
h1{font-size:1.3rem;margin:0;color:var(--green)}
.sub{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.badge{display:inline-block;min-width:26px;text-align:center;padding:3px 9px;border-radius:999px;color:#fff;font-weight:700;font-size:.85rem}
.badge.A{background:var(--a)}.badge.B{background:var(--b)}.badge.C{background:var(--c)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700}
.meta{font-size:.82rem;color:var(--muted);margin:6px 0}
.why{font-size:.9rem;margin:6px 0 10px}
details{margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;font-size:.85rem;color:var(--green);font-weight:600}
pre{white-space:pre-wrap;font-family:inherit;font-size:.9rem;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 2px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.go{background:var(--green);color:#fff;font-weight:700;width:100%;font-size:1rem}
.go:disabled{opacity:.55}
.done{background:#EAF3EE;color:var(--green);font-weight:700;width:100%;border:1px solid #CBE2D5}
.ghost{background:transparent;color:var(--muted);font-size:.8rem;padding:6px}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.gate{max-width:360px;margin:16vh auto 0;text-align:center}
.gate h1{margin-bottom:4px}
.err{color:var(--c);font-size:.85rem;min-height:1.2em;margin-top:8px}
.note{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.5}
ol.note{padding-left:18px;margin:8px 0}
ol.note li{margin:6px 0}
.pill{font-size:.75rem;background:#EAF3EE;color:var(--green);border-radius:999px;padding:3px 10px}
.cpill{font-size:.72rem;background:#EEE8D8;color:#6B5B2A;border-radius:999px;padding:3px 10px}
.okpill{font-size:.75rem;background:#EAF3EE;color:var(--green);border-radius:999px;padding:3px 10px;white-space:nowrap}
.warnpill{font-size:.75rem;background:#F7ECE3;color:#B87A1E;border-radius:999px;padding:3px 10px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.topbtns{display:flex;gap:8px}
.sect{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 2px 2px}
.kgrid{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
@media(min-width:580px){.kgrid{grid-template-columns:1fr 1fr;gap:0 10px}}
.kname{font-weight:700;font-size:1.05rem;color:var(--green)}
.kobj{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
.knums{display:flex;align-items:baseline}
.num{font-weight:800;font-size:1.35rem;margin-right:5px}
.num.o{color:var(--b)}.num.g{color:var(--green)}
.numlabel{font-size:.75rem;color:var(--muted);margin-right:16px}
.kfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkbtn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:10px}
.codeline{font-size:.78rem;color:var(--muted)}
.codeline b{color:var(--ink)}
.whline{display:flex;align-items:center;gap:8px;margin-top:10px}
.nkform{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.nkform label{font-size:.73rem;font-weight:700;color:var(--muted);margin-bottom:-4px}
.nkrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nkrow2>div{display:flex;flex-direction:column}
.nkrow2>div>:last-child{margin-top:auto}
.steps{font-size:.82rem;line-height:1.8;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;display:none}
.steps .ok{color:var(--green);font-weight:600}
.steps .err{color:var(--c);font-weight:600}
.result-ok{background:#EAF3EE;border:1px solid #CBE2D5;border-radius:10px;padding:12px 14px;font-size:.85rem;margin-top:10px;line-height:1.6}
.danger{background:#A8463A;color:#fff;font-weight:700;width:100%}
.vwrow{display:flex;gap:8px;margin-top:8px}
.vwrow .go,.vwrow .danger{flex:1;font-size:.85rem;padding:10px 12px;border-radius:10px}
</style>
</head>

function cockpitState(slug){
  return ghGet(slug+"/index.html").then(function(ex){
    if(!ex||!ex.content) throw new Error("Cockpit-Datei nicht gefunden");
    var html=utf8b64(ex.content);
    var m=html.match(/(<script type="application\/json" id="state">\n)([\s\S]*?)(\n<\/script>)/);
    if(!m) throw new Error("Cockpit-Aufbau unerwartet");
    return {html:html,m:m,st:JSON.parse(m[2])};
  });
}

    return ghPut(slug+"/index.html", b64utf8(html), msg).then(function(){return st;});
  });
}

    vwStep(ku.slug,"Zugangsdaten gespeichert \u2713"+(f.code?" (neuer Code aktiv)":""),"ok");
    vwStep(ku.slug,"Cockpit wird angepasst\u2026");
    return patchCockpit(ku.slug,f.name,f.objekt,f.abo);
  }).then(function(){
    vwStep(ku.slug,"Cockpit angepasst \u2713","ok");
    return kundenlisteSchreiben(function(liste){
      liste.kunden.forEach(function(k){if(k.slug===ku.slug){k.name=f.name;k.objekt=f.objekt;if(f.abo)k.abo=f.abo;if(k.code!==undefined)delete k.code;}});
      return liste;
    },"Kunde "+ku.slug+": Kundenliste aktualisiert");
  }).then(function(){
    vwStep(ku.slug,"Kundenliste aktualisiert \u2713","ok");
    ku.name=f.name;ku.objekt=f.objekt;if(f.abo)ku.abo=f.abo;
    nkNeu.forEach(function(e){if(e.slug===ku.slug){e.name=f.name;e.objekt=f.objekt;if(f.abo)e.abo=f.abo;}});
    if(objCache[ku.slug]&&f.abo&&ABOS[f.abo]){objCache[ku.slug].settings.abo=f.abo;objCache[ku.slug].settings.limit=ABOS[f.abo].limit;}
    try{var sb2=document.getElementById("vw-steps-"+ku.slug);if(sb2){sb2.style.display="block";var d2=document.createElement("div");d2.className="result-ok";d2.innerHTML="\u2705 <b>Gespeichert!</b>"+(f.code?" Der neue Zugangscode gilt ab sofort \u2014 der alte ist ung\u00fcltig.":"")+"<br><b>Letzter Schritt:</b> Sag Claude im Chat \u201eKunde "+esc(f.name)+" wurde ge\u00e4ndert\u201c, damit die KI-Zuordnung die neuen Daten kennt.";sb2.appendChild(d2);}}catch(e){}
    if(btn){btn.disabled=false;btn.textContent="Gespeichert \u2713";}
  })["catch"](function(err){
    vwStep(ku.slug,"Abbruch: "+err.message,"err");
    if(btn){btn.disabled=false;btn.textContent="Speichern";}
  });
}
function kundeLoeschen(ku,btn){
  if(!confirm("Kunde \u201e"+ku.name+"\u201c wirklich endg\u00fcltig l\u00f6schen?\n\nDas Cockpit und ALLE zugeh\u00f6rigen Anfragen werden aus dem System entfernt. Das kann nicht r\u00fcckg\u00e4ngig gemacht werden."))return;
  var tippe=prompt("Zur Best\u00e4tigung bitte die Kennung des Kunden eintippen:");
  if(tippe===null)return;
  if(String(tippe).trim().toLowerCase()!==ku.slug){alert("Das war nicht die Kennung \u201e"+ku.slug+"\u201c \u2014 es wurde nichts gel\u00f6scht.");return;}
  if(btn){btn.disabled=true;btn.textContent="L\u00f6sche\u2026";}
  vwStep(ku.slug,"Datenbank-Eintr\u00e4ge werden gel\u00f6scht\u2026");
  rpc("admin_kunde_loeschen",{p_admin_code:adminCode,p_slug:ku.slug}).then(function(d){
    if(d&&d.grund==="code") throw new Error("Admin-Code nicht mehr g\u00fcltig \u2014 bitte neu anmelden");
    if(d&&d.grund==="geschuetzt") throw new Error("Dieser Kunde ist gesch\u00fctzt");
    vwStep(ku.slug,"Datenbank bereinigt \u2713 (Zugang + alle Anfragen)","ok");
    vwStep(ku.slug,"Dateien werden ermittelt\u2026");
    return ghGet(ku.slug);
  }).then(function(liste){
    if(!liste||!liste.length) return [];
    return liste;
  }).then(function(dateien){
    var kette=Promise.resolve();
    dateien.forEach(function(d){
      kette=kette.then(function(){
        return fetch(GH_API+d.path,{method:"DELETE",headers:ghHeaders(),body:JSON.stringify({message:"Kunde "+ku.slug+" gel\u00f6scht: "+d.name,sha:d.sha})}).then(function(r){if(!r.ok)throw new Error("GitHub-Fehler "+r.status+" beim L\u00f6schen von "+d.name);});
      }).then(function(){vwStep(ku.slug,d.name+" entfernt \u2713","ok");});
    });
    return kette;
  }).then(function(){
    return kundenlisteSchreiben(function(liste){
      liste.kunden=liste.kunden.filter(function(k){return k.slug!==ku.slug;});
      return liste;
    },"Kunde "+ku.slug+" aus Kundenliste entfernt");
  }).then(function(){
    state.kunden=state.kunden.filter(function(k){return k.slug!==ku.slug;});
    for(var i=nkNeu.length-1;i>=0;i--){if(nkNeu[i].slug===ku.slug)nkNeu.splice(i,1);}
    try{delete state.per[ku.slug];}catch(e){}
    alert("Kunde \u201e"+ku.name+"\u201c wurde gel\u00f6scht.\n\nLetzter Schritt: Sag Claude im Chat \u201eKunde "+ku.name+" ist gel\u00f6scht\u201c, damit die KI-Zuordnung ihn vergisst.");
    render();
  })["catch"](function(err){
    vwStep(ku.slug,"Abbruch: "+err.message,"err");
    vwStep(ku.slug,"Du kannst es einfach nochmal versuchen \u2014 bereits Gel\u00f6schtes bleibt gel\u00f6scht, der Rest wird erneut angegangen.");
    if(btn){btn.disabled=false;btn.textContent="Kunde endg\u00fcltig l\u00f6schen";}
  });
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function jget(url){return fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

function load(){
  state.loading=true; render();
  var t=Date.now();
  Promise.all([
    jget(RAW+"freigabe/kunden.json?t="+t),
    rpc("admin_anfragen",{p_admin_code:adminCode})["catch"](function(){return null;})
  ]).then(function(res){
    var k=res[0], d=res[1];
    if(k&&k.kunden&&k.kunden.length){state.kunden=k.kunden;}
    nkNeu.forEach(function(e){
      var da=false; state.kunden.forEach(function(x){if(x.slug===e.slug)da=true;});
      if(da)return;
      var iU=-1; state.kunden.forEach(function(x,i){if(x.slug==="unklar")iU=i;});
      if(iU>=0){state.kunden.splice(iU,0,e);}else{state.kunden.push(e);}
    });
    state.per={};
    state.kunden.forEach(function(ku){state.per[ku.slug]={pending:[],live:[]};});
    if(d&&d.ok===true){
      state.dbOk=true;
      (d.anfragen||[]).forEach(function(a){
        if(!a||!a.id||!a.slug)return;
        if(!state.per[a.slug])state.per[a.slug]={pending:[],live:[]};
        state.per[a.slug].pending.push(a);
      });
      (d.freigegeben||[]).forEach(function(x){
        if(!x||!x.slug)return;
        if(!state.per[x.slug])state.per[x.slug]={pending:[],live:[]};
        state.per[x.slug].live.push(String(x.id));
      });
    } else {
      state.dbOk=false;
      if(d&&d.grund==="code"){state.authed=false; adminCode=""; try{localStorage.removeItem("z4-admin");}catch(e){}}
    }
  }).then(function(){state.loading=false;render();});
}

function statusOf(ku,a){
  var p=state.per[ku.slug]||{live:[]};
  if(p.live.indexOf(String(a.id))>=0) return "live";
  return "open";
}

function freigeben(ku,a,btn){
  btn.disabled=true; btn.textContent="Wird freigegeben…";
  rpc("admin_freigeben",{p_admin_code:adminCode,p_id:String(a.id),p_patch:{}}).then(function(d){
    if(!d||d.ok!==true) throw new Error(d&&d.grund==="code"?"Admin-Code nicht mehr gültig":"Freigabe fehlgeschlagen");
    var p=state.per[ku.slug]||{pending:[],live:[]};
    p.live.push(String(a.id));
    state.per[ku.slug]=p;
    render();
  })["catch"](function(err){
    btn.disabled=false; btn.textContent="✅ FREIGEBEN — ins Cockpit übernehmen";
    alert("Abbruch: "+err.message+" — du kannst es einfach nochmal versuchen.");
  });
}

function verwerfen(ku,a,btn){
  if(!confirm("Diese Anfrage von „"+a.name+"“ wirklich verwerfen?\n\nSie wird endgültig aus dem System gelöscht und erscheint in keinem Cockpit."))return;
  btn.disabled=true; btn.textContent="Verwerfe…";
  rpc("admin_verwerfen",{p_admin_code:adminCode,p_id:String(a.id)}).then(function(d){
    if(d&&d.grund==="code") throw new Error("Admin-Code nicht mehr gültig");
    var p=state.per[ku.slug]||{pending:[],live:[]};
    p.pending=p.pending.filter(function(x){return String(x.id)!==String(a.id);});
    state.per[ku.slug]=p;
    render();
  })["catch"](function(err){
    btn.disabled=false; btn.textContent="Verwerfen";
    alert("Abbruch: "+err.message);
  });
}

      +'<div><label>Objekt-Bezeichnung</label><input id="ed-obj-'+esc(ku.slug)+'" value="'+esc(ku.objekt)+'"></div></div>'
      +'<label>Abo-Paket</label><select id="ed-abo-'+esc(ku.slug)+'" style="font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff">'+aboOptions(ku.abo||"")+'</select>'
      +'<button class="go edit-save" data-slug="'+esc(ku.slug)+'">Speichern</button>'

      +(objCache[ku.slug]?objListeHtml(ku):'<p></p><button class="done obj-load" data-slug="'+esc(ku.slug)+'">\ud83c\udfe0 Objekte anzeigen/verwalten</button>')
      +'</div>'

    +'<div class="kobj">'+esc(ku.objekt)+'</div>'
    +'<div class="knums"><span class="num o">'+offen+'</span><span class="numlabel">zu entscheiden</span>'
    +'<span class="num g">'+p.live.length+'</span><span class="numlabel">im Cockpit</span></div>'
    +foot
    +verwalten
    +'</div>';

      +'<p class="note">Damit die Zentrale neue Kunden selbst anlegen kann, hinterlege einmalig deinen GitHub-Schl\u00fcssel: ganz unten bei \u201e\u2699\ufe0f Einrichtung\u201c (steht in deiner Notizen-App, beginnt mit github_pat\u2026). Er bleibt nur auf diesem Ger\u00e4t.</p>'
      +'</details></div>';

    +'<div class="nkrow2"><div><label>ImmoScout Scout-ID (optional)</label><input id="nk-scout" placeholder="170398081"></div>'
    +'<div><label>Immowelt-Nummer (optional)</label><input id="nk-iw" placeholder="3513-03"></div></div>'

function cardHtml(ku,a,st){
  var verwerfenBtn='<button class="ghost vw-del" data-id="'+esc(a.id)+'" data-slug="'+esc(ku.slug)+'" style="border:1px solid var(--line);border-radius:10px;width:100%;margin-top:6px">Verwerfen (endgültig löschen)</button>';
  var btn = ku.slug==="unklar" ? '<button class="done" disabled>Zuordnung unklar — Mail mit eindeutigem Objekt neu senden</button>'+verwerfenBtn
    : st==="open" ? '<button class="go" data-id="'+esc(a.id)+'" data-slug="'+esc(ku.slug)+'">✅ FREIGEBEN — ins Cockpit übernehmen</button>'+verwerfenBtn
    : '<button class="done" disabled>✓ Im Cockpit von '+esc(ku.name)+'</button>';

    +'<div class="meta">Einzug: '+esc(a.einzug)+' · Dauer: '+esc(a.dauer)+' · Unterlagen: '+esc(a.unterlagen)+(a.ts?(' · '+esc(a.ts)):'')+'</div>'
    +'<div class="why">'+esc(a.why)+'</div>'
    +'<details><summary>Antwortentwurf ansehen</summary><pre>'+esc(a.entwurf)+'</pre></details>'
    +'<details><summary>Original-Anfrage</summary><pre>'+esc(a.text)+'</pre></details>'

function render(){
  var el=document.getElementById("app");
  if(!state.authed){
    el.innerHTML='<div class="gate card"><h1>Kairos Zentrale</h1><div class="sub">Bitte Zugangscode eingeben</div>'
      +'<p></p><input type="password" id="gc" placeholder="Zugangscode" autofocus>'
      +'<p></p><button class="go" id="gbtn">Öffnen</button><div class="err" id="gerr"></div></div>';
    document.getElementById("gbtn").onclick=tryGate;
    document.getElementById("gc").addEventListener("keydown",function(e){if(e.key==="Enter")tryGate();});
    return;
  }
  var h='<header><div><h1>Kairos Zentrale</h1><div class="sub">Dein Arbeitsplatz · Kunden & Freigaben</div></div>'
    +'<div class="topbtns"><button class="ghost" id="reload">↻ Aktualisieren</button></div></header>';
  if(state.loading){ el.innerHTML=h+'<div class="empty">Lade Daten…</div>'; bind(); return; }

  if(state.dbOk===false){
    h+='<div class="card" style="border-color:#B87A1E;background:#FDF6EC"><b>⚠️ Datenbank gerade nicht erreichbar.</b><div class="note">Anfragen können im Moment nicht geladen oder freigegeben werden. Oben „↻ Aktualisieren“ drücken — wenn es bleibt, Claude Bescheid sagen.</div></div>';
  }

  /* Kundenübersicht */
  h+='<p class="sect">Kunden</p><div class="kgrid">';
  state.kunden.forEach(function(ku){ h+=kundeCard(ku); });
  h+=addCard()+'</div>';

  /* Anfragen einsammeln: offen + gerade übertragen bleiben oben, nur Live wandert zu Erledigt */
  var open=[],done=[],openCnt=0;
  state.kunden.forEach(function(ku){
    var p=state.per[ku.slug]||{pending:[]};
    p.pending.forEach(function(a){
      var st=statusOf(ku,a);
      if(st==="live"){ done.push({ku:ku,a:a,st:st}); }
      else{ if(st==="open")openCnt++; open.push({ku:ku,a:a,st:st}); }
    });
  });
  open.sort(function(x,y){return Number(y.a.id)-Number(x.a.id);});
  done.sort(function(x,y){return Number(y.a.id)-Number(x.a.id);});

  h+='<p class="sect">Zu entscheiden ('+openCnt+')</p>';
  if(!open.length){ h+='<div class="empty">Nichts offen — alles entschieden.<br>Neue eingestufte Anfragen erscheinen hier automatisch.</div>'; }
  open.forEach(function(x){ h+=cardHtml(x.ku,x.a,x.st); });

  if(done.length){
    h+='<details style="border:0;margin-top:18px"><summary>Erledigt ('+done.length+')</summary>';
    done.forEach(function(x){ h+=cardHtml(x.ku,x.a,x.st); });
    h+='</details>';
  }
  h+='<div class="card" style="margin-top:22px"><details><summary>⚙️ Einrichtung</summary>'
    +'<p class="note"><b>GitHub-Schl\u00fcssel</b> \u2014 n\u00f6tig, damit die Zentrale Kunden-Seiten anlegen und verwalten kann ('+(ghTokenGet()?'hinterlegt \u2713':'noch nicht hinterlegt')+'). Er wird nur auf diesem Ger\u00e4t gespeichert.</p>'
    +'<input id="ghtok" type="password" placeholder="github_pat_\u2026" value="'+esc(ghTokenGet())+'">'
    +'<p></p><button class="go" id="ghtoksave">Schl\u00fcssel speichern</button>'
    +'<p class="note" style="margin-top:18px"><b>Zentrale-Zugangscode \u00e4ndern</b> \u2014 der Code, mit dem du dich hier anmeldest (mind. 8 Zeichen, wird sicher auf dem Server gepr\u00fcft).</p>'
    +'<input id="admneu" type="password" placeholder="neuer Zugangscode (mind. 8 Zeichen)" autocomplete="new-password">'
    +'<p></p><button class="go" id="admsave">Zugangscode \u00e4ndern</button></details></div>';
  h+='<p class="note" style="text-align:center;margin-top:26px">Kairos Zentrale · Version 4.0 · Anfragedaten liegen zugriffsgesch\u00fctzt in der EU-Datenbank</p>';
  el.innerHTML=h; bind();
}

function bind(){
  var r=document.getElementById("reload"); if(r) r.onclick=load;
  var adm=document.getElementById("admsave");
  if(adm) adm.onclick=function(){
    var inp=document.getElementById("admneu");
    var v=inp?inp.value.trim():"";
    if(v.length<8){alert("Der neue Zugangscode braucht mindestens 8 Zeichen.");return;}
    adm.disabled=true; adm.textContent="Ändere…";
    rpc("admin_code_aendern",{p_admin_code:adminCode,p_neu:v}).then(function(d){
      if(!d||d.ok!==true) throw new Error(d&&d.grund==="zu_kurz"?"Der neue Code ist zu kurz":"Code konnte nicht geändert werden");
      adminCode=v; try{localStorage.setItem("z4-admin",v);}catch(e){}
      alert("Zugangscode geändert ✓ — ab sofort gilt nur noch der neue Code.");
      adm.disabled=false; adm.textContent="Zugangscode ändern"; if(inp)inp.value="";
    })["catch"](function(err){
      adm.disabled=false; adm.textContent="Zugangscode ändern";
      alert("Abbruch: "+err.message);
    });
  };
  var gt=document.getElementById("ghtoksave");
  if(gt) gt.onclick=function(){
    var inp=document.getElementById("ghtok");
    var v=inp?inp.value.trim():"";
    if(v&&v.indexOf("github_pat_")!==0&&v.indexOf("ghp_")!==0){alert("Das sieht nicht nach einem GitHub-Schl\u00fcssel aus (beginnt mit github_pat_).");return;}
    ghTokenSet(v);
    alert(v?"Schl\u00fcssel gespeichert \u2713":"Schl\u00fcssel entfernt.");
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("button.edit-save"),function(b){
    b.onclick=function(){
      var slug=b.getAttribute("data-slug");
      var ku=null; state.kunden.forEach(function(k){if(k.slug===slug)ku=k;});
      if(!ku)return;
      function v(id){var e=document.getElementById(id);return e?clean(e.value):"";}
      var f={name:v("ed-name-"+slug),code:(document.getElementById("ed-code-"+slug)?document.getElementById("ed-code-"+slug).value.trim():""),objekt:v("ed-obj-"+slug),abo:(document.getElementById("ed-abo-"+slug)?document.getElementById("ed-abo-"+slug).value:"")};
      if(f.abo&&!ABOS[f.abo]){f.abo="";}
      if(!/^[^<>&"]{2,40}$/.test(f.name)){alert("Bitte einen g\u00fcltigen Kundennamen eingeben (2\u201340 Zeichen, ohne < > &).");return;}
      if(f.code&&f.code.length<8){alert("Ein neuer Zugangscode braucht mindestens 8 Zeichen \u2014 oder lass das Feld leer, dann bleibt der alte Code.");return;}
      if(!/^[^<>&"]{3,80}$/.test(f.objekt)){alert("Bitte eine g\u00fcltige Objekt-Bezeichnung eingeben (3\u201380 Zeichen, ohne < > &).");return;}
      var sb=document.getElementById("vw-steps-"+slug); if(sb){sb.innerHTML="";}
      kundeSpeichern(ku,f,b);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("button.kd-del"),function(b){
    b.onclick=function(){
      var slug=b.getAttribute("data-slug");
      var ku=null; state.kunden.forEach(function(k){if(k.slug===slug)ku=k;});
      if(!ku)return;
      var sb=document.getElementById("vw-steps-"+slug); if(sb){sb.innerHTML="";}
      kundeLoeschen(ku,b);
    };
  });
  var nn=document.getElementById("nk-name");
  if(nn) nn.oninput=function(){var s=document.getElementById("nk-slug");if(s&&!s.getAttribute("data-touched"))s.value=slugVorschlag(nn.value);};
  var ns=document.getElementById("nk-slug");
  if(ns) ns.oninput=function(){ns.setAttribute("data-touched","1");};
  var ng=document.getElementById("nk-go");
  if(ng) ng.onclick=function(){
    function val(id){var e=document.getElementById(id);return e?e.value.trim():"";}
    var f={name:clean(val("nk-name")),slug:val("nk-slug").toLowerCase(),code:val("nk-code"),objekt:clean(val("nk-obj")),miete:Number(val("nk-miete").replace(/[^0-9]/g,"")),dauer:clean(val("nk-dauer")),krit:clean(val("nk-krit")),scout:val("nk-scout").replace(/[^0-9a-zA-Z-]/g,""),iw:val("nk-iw").replace(/[^0-9a-zA-Z-]/g,""),abo:(document.getElementById("nk-abo")?document.getElementById("nk-abo").value:"starter")};
    if(!ABOS[f.abo]){f.abo="starter";}
    if(!/^[^<>&"]{2,40}$/.test(f.name)){alert("Bitte einen Kundennamen eingeben (2\u201340 Zeichen, ohne Sonderzeichen wie < > &).");return;}
    if(!/^[a-z0-9-]{2,20}$/.test(f.slug)){alert("Die Kennung darf nur Kleinbuchstaben, Zahlen und Bindestriche enthalten (2\u201320 Zeichen).");return;}
    if(RESERVIERT.indexOf(f.slug)>=0){alert("Diese Kennung ist reserviert \u2014 bitte eine andere w\u00e4hlen.");return;}
    var belegt=false; state.kunden.forEach(function(k){if(k.slug===f.slug)belegt=true;});
    if(belegt){alert("Diese Kennung ist schon vergeben \u2014 bitte eine andere w\u00e4hlen.");return;}
    if(!/^[^<>&"\s]{8,40}$/.test(f.code)){alert("Der Zugangscode braucht mindestens 8 Zeichen (ohne Leerzeichen) \u2014 z. B. zwei W\u00f6rter mit Zahl: eppendorf-2026.");return;}
    if(!/^[^<>&"]{3,80}$/.test(f.objekt)){alert("Bitte eine Objekt-Bezeichnung eingeben (3\u201380 Zeichen, ohne < > &).");return;}
    if(!(f.miete>0)){alert("Bitte die Kaltmiete als Zahl eingeben.");return;}
    if(!ghTokenGet()){alert("Bitte zuerst unten in der Einrichtung den GitHub-Schl\u00fcssel hinterlegen.");return;}
    var b=document.getElementById("nk-steps"); if(b){b.innerHTML="";}
    neuerKunde(f);
  };
  Array.prototype.forEach.call(document.querySelectorAll("button.go[data-id]"),function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-id"), slug=b.getAttribute("data-slug");
      var ku=null; state.kunden.forEach(function(k){if(k.slug===slug)ku=k;});
      if(!ku) return;
      var p=state.per[slug]||{pending:[]};
      var a=p.pending.filter(function(x){return String(x.id)===String(id);})[0];
      if(a) freigeben(ku,a,b);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("button.vw-del"),function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-id"), slug=b.getAttribute("data-slug");
      var ku=null; state.kunden.forEach(function(k){if(k.slug===slug)ku=k;});
      if(!ku) return;
      var p=state.per[slug]||{pending:[]};
      var a=p.pending.filter(function(x){return String(x.id)===String(id);})[0];
      if(a) verwerfen(ku,a,b);
    };
  });
}

document.addEventListener("click",function(ev){
  if(!ev.target||!ev.target.closest) return;
  var el;
  if(el=ev.target.closest(".obj-load")){
    var slug=el.getAttribute("data-slug");
    var ku=null; state.kunden.forEach(function(k){if(k.slug===slug)ku=k;});
    if(!ku)return;
    el.disabled=true; el.textContent="Lade Objekte…";
    cockpitState(slug).then(function(c){
      objCache[slug]=c.st;
      var w=document.getElementById("objwrap-"+slug);
      if(w){w.setAttribute("data-loaded","1");w.innerHTML=objListeHtml(ku);}
    })["catch"](function(err){
      el.disabled=false; el.textContent="\ud83c\udfe0 Objekte anzeigen/verwalten";
      alert("Objekte konnten nicht geladen werden: "+err.message);
    });
    return;
  }
  if(el=ev.target.closest(".obj-tgl")){
    var slug2=el.getAttribute("data-slug"), oid=el.getAttribute("data-oid");
    var ku2=null; state.kunden.forEach(function(k){if(k.slug===slug2)ku2=k;});
    var stC=objCache[slug2];
    if(!ku2||!stC)return;
    var o=null; stC.objekte.forEach(function(x){if(x.id===oid)o=x;});
    if(!o)return;
    if(o.status!=="aktiv"){
      var limT=(stC.settings&&stC.settings.limit)||3;
      var aktT=stC.objekte.filter(function(x){return x.status==="aktiv";}).length;
      if(aktT>=limT){alert("Objekt-Limit erreicht — zuerst das Abo-Paket erh\u00f6hen oder ein anderes Objekt auf vermietet stellen.");return;}
    }
    el.disabled=true; el.textContent="Speichere…";
    cockpitSchreiben(slug2,function(st){
      st.objekte.forEach(function(x){if(x.id===oid)x.status=(x.status==="aktiv"?"vermietet":"aktiv");});
      return st;
    },"Kunde "+slug2+": Objekt-Status ge\u00e4ndert").then(function(st){
      objCache[slug2]=st;
      var w=document.getElementById("objwrap-"+slug2);
      if(w)w.innerHTML=objListeHtml(ku2);
    })["catch"](function(err){
      el.disabled=false; el.textContent=(o.status==="aktiv"?"Auf vermietet":"Aktivieren");
      alert("Abbruch: "+err.message+" \u2014 du kannst es einfach nochmal versuchen.");
    });
    return;
  }
  if(el=ev.target.closest(".obj-add")){
    var slug3=el.getAttribute("data-slug");
    var ku3=null; state.kunden.forEach(function(k){if(k.slug===slug3)ku3=k;});
    var stC3=objCache[slug3];
    if(!ku3||!stC3)return;
    function ov(p){var e=document.getElementById("oa-"+p+"-"+slug3);return e?clean(e.value):"";}
    var mieteRoh=document.getElementById("oa-miete-"+slug3)?document.getElementById("oa-miete-"+slug3).value:"";
    var f3={name:ov("name"),miete:Number(String(mieteRoh).replace(/[^0-9]/g,"")),dauer:ov("dauer"),krit:ov("krit"),
      scout:(document.getElementById("oa-scout-"+slug3)?document.getElementById("oa-scout-"+slug3).value:"").replace(/[^0-9a-zA-Z-]/g,""),
      iw:(document.getElementById("oa-iw-"+slug3)?document.getElementById("oa-iw-"+slug3).value:"").replace(/[^0-9a-zA-Z-]/g,"")};
    if(!/^[^<>&"]{3,80}$/.test(f3.name)){alert("Bitte eine Objekt-Bezeichnung eingeben (3\u201380 Zeichen, ohne < > &).");return;}
    if(!(f3.miete>0)){alert("Bitte die Kaltmiete als Zahl eingeben.");return;}
    var lim3=(stC3.settings&&stC3.settings.limit)||3;
    var akt3=stC3.objekte.filter(function(x){return x.status==="aktiv";}).length;
    if(akt3>=lim3){alert("Objekt-Limit erreicht \u2014 zuerst das Abo-Paket erh\u00f6hen.");return;}
    el.disabled=true; el.textContent="Lege Objekt an\u2026";
    cockpitSchreiben(slug3,function(st){
      var lim=(st.settings&&st.settings.limit)||3;
      var akt=st.objekte.filter(function(x){return x.status==="aktiv";}).length;
      if(akt>=lim) throw new Error("Objekt-Limit erreicht");
      st.objekte.push({id:objUid(),name:f3.name,miete:f3.miete,moebl:"",ab:"",dauer:f3.dauer,refImmowelt:f3.iw,refScout:f3.scout,krit:f3.krit,status:"aktiv"});
      return st;
    },"Kunde "+slug3+": Objekt angelegt").then(function(st){
      objCache[slug3]=st;
      var w=document.getElementById("objwrap-"+slug3);
      if(w)w.innerHTML=objListeHtml(ku3);
      alert("Objekt angelegt \u2713\n\nLetzter Schritt: Sag Claude im Chat \u201eNeues Objekt bei "+ku3.name+": "+f3.name+"\u201c \u2014 dann ordnet die KI eingehende Anfragen auch diesem Objekt zu.");
    })["catch"](function(err){
      el.disabled=false; el.textContent="Objekt anlegen";
      alert("Abbruch: "+err.message+" \u2014 du kannst es einfach nochmal versuchen.");
    });
    return;
  }
});

function tryGate(){
  var v=document.getElementById("gc").value.trim();
  var ge=document.getElementById("gerr");
  var gb=document.getElementById("gbtn");
  if(!v){ge.textContent="Bitte Zugangscode eingeben.";return;}
  if(gb){gb.disabled=true;gb.textContent="Prüfe…";}
  rpc("admin_anfragen",{p_admin_code:v}).then(function(d){
    if(d&&d.ok===true){
      adminCode=v; state.authed=true;
      try{localStorage.setItem("z4-admin",v);}catch(e){}
      load();
    } else {
      ge.textContent="Code nicht korrekt — bitte erneut versuchen.";
      if(gb){gb.disabled=false;gb.textContent="Öffnen";}
    }
  })["catch"](function(err){
    ge.textContent=(String(err&&err.message).indexOf("verbunden")>=0)?"Die Datenbank ist noch nicht verbunden — das richtet Claude gerade ein.":"Keine Verbindung — bitte Internet prüfen und erneut versuchen.";
    if(gb){gb.disabled=false;gb.textContent="Öffnen";}
  });
}

if(adminCode){state.authed=true; load();} else {render();}
setInterval(function(){
  if(!state.authed||state.loading) return;
  var ae=document.activeElement;
  if(ae&&ae.closest&&(ae.closest(".nkform")||ae.id==="ghtok"||ae.id==="admneu")) return;

  if(document.querySelector(".objwrap[data-loaded]")) return;

},120000);
