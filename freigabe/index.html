<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos Zentrale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0C5F45">
<style>
:root{--bg:#F5F0E6;--card:#FFFFFF;--ink:#1E2A26;--muted:#6B7570;--green:#0C5F45;--green2:#0E7A57;--line:#E3DCCB;
--a:#0C5F45;--b:#B87A1E;--c:#A8463A;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 2px}
h1{font-size:1.3rem;margin:0;color:var(--green)}
.sub{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.badge{display:inline-block;min-width:26px;text-align:center;padding:3px 9px;border-radius:999px;color:#fff;font-weight:700;font-size:.85rem}
.badge.A{background:var(--a)}.badge.B{background:var(--b)}.badge.C{background:var(--c)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700}
.meta{font-size:.82rem;color:var(--muted);margin:6px 0}
.why{font-size:.9rem;margin:6px 0 10px}
details{margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;font-size:.85rem;color:var(--green);font-weight:600}
pre{white-space:pre-wrap;font-family:inherit;font-size:.9rem;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 2px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.go{background:var(--green);color:#fff;font-weight:700;width:100%;font-size:1rem}
.go:disabled{opacity:.55}
.done{background:#EAF3EE;color:var(--green);font-weight:700;width:100%;border:1px solid #CBE2D5}
.ghost{background:transparent;color:var(--muted);font-size:.8rem;padding:6px}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.gate{max-width:360px;margin:16vh auto 0;text-align:center}
.gate h1{margin-bottom:4px}
.err{color:var(--c);font-size:.85rem;min-height:1.2em;margin-top:8px}
.note{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.5}
ol.note{padding-left:18px;margin:8px 0}
ol.note li{margin:6px 0}
.pill{font-size:.75rem;background:#EAF3EE;color:var(--green);border-radius:999px;padding:3px 10px}
.cpill{font-size:.72rem;background:#EEE8D8;color:#6B5B2A;border-radius:999px;padding:3px 10px}
.okpill{font-size:.75rem;background:#EAF3EE;color:var(--green);border-radius:999px;padding:3px 10px;white-space:nowrap}
.warnpill{font-size:.75rem;background:#F7ECE3;color:#B87A1E;border-radius:999px;padding:3px 10px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.topbtns{display:flex;gap:8px}
.sect{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 2px 2px}
.kgrid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:580px){.kgrid{grid-template-columns:1fr 1fr;gap:0 10px}}
.kname{font-weight:700;font-size:1.05rem;color:var(--green)}
.kobj{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
.knums{display:flex;align-items:baseline}
.num{font-weight:800;font-size:1.35rem;margin-right:5px}
.num.o{color:var(--b)}.num.g{color:var(--green)}
.numlabel{font-size:.75rem;color:var(--muted);margin-right:16px}
.kfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkbtn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:10px}
.codeline{font-size:.78rem;color:var(--muted)}
.codeline b{color:var(--ink)}
.whline{display:flex;align-items:center;gap:8px;margin-top:10px}
.nkform{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.nkform label{font-size:.73rem;font-weight:700;color:var(--muted);margin-bottom:-4px}
.nkrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps{font-size:.82rem;line-height:1.8;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;display:none}
.steps .ok{color:var(--green);font-weight:600}
.steps .err{color:var(--c);font-weight:600}
.result-ok{background:#EAF3EE;border:1px solid #CBE2D5;border-radius:10px;padding:12px 14px;font-size:.85rem;margin-top:10px;line-height:1.6}
.danger{background:#A8463A;color:#fff;font-weight:700;width:100%}
.vwrow{display:flex;gap:8px;margin-top:8px}
.vwrow .go,.vwrow .danger{flex:1;font-size:.85rem;padding:10px 12px;border-radius:10px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
var CODE="kairo";
var RAW="https://raw.githubusercontent.com/kairos-gate/kairos-gate.github.io/main/";
var PAGES="https://kairos-gate.github.io/";
var DEFAULT_KUNDEN=[{"slug":"winkler","name":"Frau Winkler","objekt":"Privatstrasse Am Rothenbaum · 2-Zi möbliert","code":"rothenbaum"}];
var state={authed:false,kunden:DEFAULT_KUNDEN.slice(),per:{},sent:{},loading:true};
try{state.authed=sessionStorage.getItem("fg-auth")==="1";}catch(e){}
try{state.sent=JSON.parse(localStorage.getItem("fg-sent")||"{}");}catch(e){state.sent={};}
function whGet(){try{return localStorage.getItem("fg-webhook-all")||"";}catch(e){return "";}}
function whSet(v){try{if(v){localStorage.setItem("fg-webhook-all",v);}else{localStorage.removeItem("fg-webhook-all");}}catch(e){}}
var GH_API="https://api.github.com/repos/kairos-gate/kairos-gate.github.io/contents/";
var DUMMY_DATEI='{"anfragen":[\n{"id":0,"obj":"o1","ts":"","name":"Platzhalter","kurz":"","typ":"leer","stufe":"C","astatus":"bereit","dauer":"","einzug":"","unterlagen":"","why":"","text":"","entwurf":""}\n]}';
var RESERVIERT=["freigabe","unklar","icons","assets"];
var ABOS={starter:{name:"Starter",limit:1},pro:{name:"Pro",limit:3},premium:{name:"Premium",limit:10}};
function aboName(a){var x=ABOS[a];return x?x.name:"";}
function aboOptions(sel){
  var h=sel?"":'<option value="">— bitte wählen —</option>';
  Object.keys(ABOS).forEach(function(k){
    h+='<option value="'+k+'"'+(sel===k?" selected":"")+'>'+ABOS[k].name+' — bis '+ABOS[k].limit+' Objekt'+(ABOS[k].limit>1?"e":"")+'</option>';
  });
  return h;
}
var nkNeu=[];
function ghTokenGet(){try{return localStorage.getItem("gh-token")||"";}catch(e){return "";}}
function ghTokenSet(v){try{if(v){localStorage.setItem("gh-token",v);}else{localStorage.removeItem("gh-token");}}catch(e){}}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)));}
function utf8b64(b){return decodeURIComponent(escape(atob(String(b).replace(/\n/g,""))));}
function bufToB64(buf){var bin="",u=new Uint8Array(buf);for(var i=0;i<u.length;i++){bin+=String.fromCharCode(u[i]);}return btoa(bin);}
function ghHeaders(){return {"Authorization":"Bearer "+ghTokenGet(),"Accept":"application/vnd.github+json"};}
function ghGet(path){return fetch(GH_API+path+"?t="+Date.now(),{headers:ghHeaders()}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("GitHub-Fehler "+r.status+" beim Lesen von "+path);return r.json();});}
function ghPut(path,b64,msg){return ghGet(path).then(function(ex){var body={message:msg,content:b64};if(ex&&ex.sha)body.sha=ex.sha;return fetch(GH_API+path,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});}).then(function(r){if(!r.ok)return r.json()["catch"](function(){return{};}).then(function(j){throw new Error("GitHub-Fehler "+r.status+" bei "+path+(j&&j.message?" ("+j.message+")":""));});return r.json();});}
function clean(s){return String(s).replace(/[\u201e\u201c\u201d\u2018\u2019\u00ab\u00bb"']/g,"").replace(/\s+/g," ").trim();}
function slugVorschlag(s){
  s=String(s).toLowerCase().replace(/\b(frau|herr|herrn|familie|firma|immobilien|gmbh|gbr|kg|ag|ug|makler)\b/g," ").trim();
  var w=s.split(/\s+/).filter(function(x){return x;});
  if(w.length)s=w[w.length-1];
  return s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"").slice(0,20);
}
function nkStep(txt,cls){try{var b=document.getElementById("nk-steps");if(b){b.style.display="block";var d=document.createElement("div");if(cls)d.className=cls;d.textContent=txt;b.appendChild(d);}}catch(e){}}
function neuerKunde(f){
  var btn=document.getElementById("nk-go"); if(btn){btn.disabled=true;btn.textContent="Lege Kunden an…";}
  var tpl={}, icons={};
  var basis="../"; var t=Date.now();
  nkStep("Vorlage wird geladen…");
  Promise.all([
    fetch(basis+"petersen/index.html?t="+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Vorlage index.html nicht erreichbar");return r.text();}),
    fetch(basis+"petersen/sw.js?t="+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Vorlage sw.js nicht erreichbar");return r.text();}),
    fetch(basis+"petersen/manifest.webmanifest?t="+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Vorlage manifest nicht erreichbar");return r.text();}),
    fetch(basis+"petersen/icon-192.png?t="+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Icon 192 nicht erreichbar");return r.arrayBuffer();}),
    fetch(basis+"petersen/icon-512.png?t="+t,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Icon 512 nicht erreichbar");return r.arrayBuffer();})
  ]).then(function(res){
    nkStep("Vorlage geladen","ok");
    tpl.html=res[0]; tpl.sw=res[1]; tpl.mf=res[2]; icons.i192=bufToB64(res[3]); icons.i512=bufToB64(res[4]);
    /* Cockpit aus Vorlage bauen */
    var st={savedAt:Date.now(),settings:{code:f.code,abo:f.abo,limit:(ABOS[f.abo]||ABOS.starter).limit,brand:"Anfragen-Assistent",kunde:f.name,minProAnfrage:3},
      objekte:[{id:"o1",name:f.objekt,miete:f.miete,moebl:"",ab:"",dauer:f.dauer||"",refImmowelt:f.iw||"",refScout:f.scout||"",krit:f.krit||"",status:"aktiv"}],
      anfragen:[]};
    var html=tpl.html.replace(/(<script type="application\/json" id="state">\n)[\s\S]*?(\n<\/script>)/,function(m,a,b){return a+JSON.stringify(st)+b;});
    html=html.split("mc-state-petersen").join("mc-state-"+f.slug).split("mc-auth-petersen").join("mc-auth-"+f.slug);
    html=html.replace(/<title>[^<]*<\/title>/,"<title>Makler-Cockpit \u00b7 "+f.name+"</title>");
    var sw=tpl.sw.split("cockpit-petersen-v1").join("cockpit-"+f.slug+"-v1");
    var mf; try{mf=JSON.parse(tpl.mf);}catch(e){mf={start_url:"./",scope:"./",display:"standalone",background_color:"#F5F0E6",theme_color:"#0C5F45",icons:[{src:"icon-192.png",sizes:"192x192",type:"image/png"},{src:"icon-512.png",sizes:"512x512",type:"image/png","purpose":"any maskable"}]};}
    mf.name="Cockpit "+f.name; mf.short_name=f.slug.charAt(0).toUpperCase()+f.slug.slice(1);
    var msg="Neuer Kunde "+f.slug;
    var dateien=[
      [f.slug+"/index.html",b64utf8(html),"Cockpit-Seite"],
      [f.slug+"/manifest.webmanifest",b64utf8(JSON.stringify(mf,null,2)),"App-Manifest"],
      [f.slug+"/sw.js",b64utf8(sw),"Service Worker"],
      [f.slug+"/icon-192.png",icons.i192,"Icon klein"],
      [f.slug+"/icon-512.png",icons.i512,"Icon gro\u00df"],
      [f.slug+"/pending.json",b64utf8(DUMMY_DATEI),"Warteschlange"],
      [f.slug+"/data.json",b64utf8(DUMMY_DATEI),"Cockpit-Daten"]
    ];
    var kette=Promise.resolve();
    dateien.forEach(function(d){
      kette=kette.then(function(){return ghPut(d[0],d[1],msg+": "+d[2]);}).then(function(){nkStep(d[2]+" \u2713","ok");});
    });
    return kette;
  }).then(function(){
    /* Kundenliste ergaenzen */
    return ghGet("freigabe/kunden.json").then(function(ex){
      var liste={kunden:[]};
      if(ex&&ex.content){try{liste=JSON.parse(utf8b64(ex.content));}catch(e){}}
      if(!liste.kunden)liste.kunden=[];
      liste.kunden=liste.kunden.filter(function(k){return k.slug!==f.slug;});
      var eintrag={slug:f.slug,name:f.name,objekt:f.objekt,code:f.code,abo:f.abo};
      var idxU=-1; liste.kunden.forEach(function(k,i){if(k.slug==="unklar")idxU=i;});
      if(idxU>=0){liste.kunden.splice(idxU,0,eintrag);}else{liste.kunden.push(eintrag);}
      var body={message:"Neuer Kunde "+f.slug+": Kundenliste",content:b64utf8(JSON.stringify(liste,null,1))};
      if(ex&&ex.sha)body.sha=ex.sha;
      return fetch(GH_API+"freigabe/kunden.json",{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("GitHub-Fehler "+r.status+" bei der Kundenliste");});
    });
  }).then(function(){
    nkStep("Kundenliste aktualisiert \u2713","ok");
    /* Sofort lokal anzeigen */
    var eintrag={slug:f.slug,name:f.name,objekt:f.objekt,code:f.code,abo:f.abo};
    nkNeu.push(eintrag);
    var iU=-1; state.kunden.forEach(function(k,i){if(k.slug==="unklar")iU=i;});
    if(iU>=0){state.kunden.splice(iU,0,eintrag);}else{state.kunden.push(eintrag);}
    state.per[f.slug]={pending:[],live:[]};
    try{var b=document.getElementById("nk-steps");if(b){var d=document.createElement("div");d.className="result-ok";d.innerHTML="\u2705 <b>"+esc(f.name)+"</b> ist angelegt!<br>Cockpit: <a href=\""+esc(PAGES+f.slug+"/")+"\" target=\"_blank\" rel=\"noopener\">kairos-gate.github.io/"+esc(f.slug)+"/</a> \u00b7 Zugang: <b>"+esc(f.code)+"</b> (Seite ist in 1\u201310 Minuten erreichbar)<br><b>Letzter Schritt:</b> Sag Claude im Chat \u201eKunde "+esc(f.name)+" ist angelegt\u201c \u2014 dann lernt die KI-Zuordnung das neue Objekt. Bis dahin landen seine Anfragen unter \u201eNicht zugeordnet\u201c.";b.appendChild(d);}}catch(e){}
    if(btn){btn.textContent="Fertig \u2713";}
  })["catch"](function(err){
    nkStep("Abbruch: "+err.message,"err");
    nkStep("Nichts kaputt \u2014 du kannst es einfach nochmal versuchen (bereits angelegte Dateien werden sauber \u00fcberschrieben).");
    if(btn){btn.disabled=false;btn.textContent="\ud83c\udfd7\ufe0f Kunde anlegen";}
  });
}
function vwStep(slug,txt,cls){try{var b=document.getElementById("vw-steps-"+slug);if(b){b.style.display="block";var d=document.createElement("div");if(cls)d.className=cls;d.textContent=txt;b.appendChild(d);}}catch(e){}}
function cockpitState(slug){
  return ghGet(slug+"/index.html").then(function(ex){
    if(!ex||!ex.content) throw new Error("Cockpit-Datei nicht gefunden");
    var html=utf8b64(ex.content);
    var m=html.match(/(<script type="application\/json" id="state">\n)([\s\S]*?)(\n<\/script>)/);
    if(!m) throw new Error("Cockpit-Aufbau unerwartet");
    return {html:html,m:m,st:JSON.parse(m[2])};
  });
}
function cockpitSchreiben(slug,mut,msg){
  return cockpitState(slug).then(function(c){
    var st=mut(c.st)||c.st;
    st.savedAt=Date.now();
    var html=c.html.replace(c.m[0], c.m[1]+JSON.stringify(st)+c.m[3]);
    return ghPut(slug+"/index.html", b64utf8(html), msg).then(function(){return st;});
  });
}
function patchCockpit(slug,nm,cd,objName,abo){
  return cockpitState(slug).then(function(c){
    var st=c.st;
    st.settings.kunde=nm; st.settings.code=cd;
    if(abo&&ABOS[abo]){st.settings.abo=abo; st.settings.limit=ABOS[abo].limit;}
    if(st.objekte&&st.objekte[0]) st.objekte[0].name=objName;
    st.savedAt=Date.now();
    var html=c.html.replace(c.m[0], c.m[1]+JSON.stringify(st)+c.m[3]);
    html=html.replace(/<title>[^<]*<\/title>/,"<title>Makler-Cockpit \u00b7 "+nm+"</title>");
    return ghPut(slug+"/index.html", b64utf8(html), "Kunde "+slug+": Daten bearbeitet");
  });
}
var objCache={};
function objUid(){return "o"+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);}
function objListeHtml(ku){
  var st=objCache[ku.slug];
  if(!st) return "";
  var lim=(st.settings&&st.settings.limit)||3;
  var abo=(st.settings&&st.settings.abo)?aboName(st.settings.abo):"";
  var akt=st.objekte.filter(function(o){return o.status==="aktiv";}).length;
  var h='<p class="note" style="margin-top:12px"><b>Objekte</b> \u2014 '+(abo?('Paket '+esc(abo)+' \u00b7 '):'')+akt+' von '+lim+' aktiv</p>';
  st.objekte.forEach(function(o){
    h+='<div class="row" style="justify-content:space-between;border-top:1px dashed var(--line);padding:8px 0">'
      +'<span style="flex:1;min-width:150px"><b>'+esc(o.name)+'</b><br><span class="note">'+(o.miete?(o.miete+" \u20ac \u00b7 "):"")+(o.status==="aktiv"?"aktiv":"vermietet")
      +((o.refScout||o.refImmowelt)?(" \u00b7 "+esc([o.refScout?("Scout "+o.refScout):"",o.refImmowelt?("IW "+o.refImmowelt):""].filter(Boolean).join(" \u00b7 "))):"")+'</span></span>'
      +'<button class="ghost obj-tgl" data-slug="'+esc(ku.slug)+'" data-oid="'+esc(o.id)+'" style="border:1px solid var(--line);border-radius:10px">'+(o.status==="aktiv"?"Auf vermietet":"Aktivieren")+'</button>'
      +'</div>';
  });
  if(akt<lim){
    h+='<details style="border:0"><summary>\uff0b Objekt hinzuf\u00fcgen</summary><div class="nkform">'
      +'<label>Objekt-Bezeichnung</label><input id="oa-name-'+esc(ku.slug)+'" placeholder="z. B. Isestra\u00dfe 21 \u00b7 3-Zi Altbau">'
      +'<div class="nkrow2"><div><label>Kaltmiete in \u20ac</label><input id="oa-miete-'+esc(ku.slug)+'" inputmode="numeric" placeholder="1700"></div>'
      +'<div><label>Mindestmietdauer</label><input id="oa-dauer-'+esc(ku.slug)+'" placeholder="z. B. min. 12 Monate"></div></div>'
      +'<div class="nkrow2"><div><label>ImmoScout Scout-ID (optional)</label><input id="oa-scout-'+esc(ku.slug)+'" placeholder="170398082"></div>'
      +'<div><label>Immowelt-Nummer (optional)</label><input id="oa-iw-'+esc(ku.slug)+'" placeholder="3513-04"></div></div>'
      +'<label>Kriterien f\u00fcr Top-Kandidaten (optional)</label><input id="oa-krit-'+esc(ku.slug)+'" placeholder="z. B. max. 2 Personen">'
      +'<button class="go obj-add" data-slug="'+esc(ku.slug)+'">Objekt anlegen</button>'
      +'</div></details>';
  } else {
    h+='<p class="note">Objekt-Limit des Pakets erreicht \u2014 f\u00fcr mehr Objekte oben das Abo-Paket erh\u00f6hen.</p>';
  }
  return h;
}
function kundenlisteSchreiben(aender,msg){
  return ghGet("freigabe/kunden.json").then(function(ex){
    var liste={kunden:[]};
    if(ex&&ex.content){try{liste=JSON.parse(utf8b64(ex.content));}catch(e){}}
    if(!liste.kunden)liste.kunden=[];
    liste=aender(liste);
    var body={message:msg,content:b64utf8(JSON.stringify(liste,null,1))};
    if(ex&&ex.sha)body.sha=ex.sha;
    return fetch(GH_API+"freigabe/kunden.json",{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("GitHub-Fehler "+r.status+" bei der Kundenliste");});
  });
}
function kundeSpeichern(ku,f,btn){
  if(btn){btn.disabled=true;btn.textContent="Speichere\u2026";}
  vwStep(ku.slug,"Cockpit wird angepasst\u2026");
  patchCockpit(ku.slug,f.name,f.code,f.objekt,f.abo).then(function(){
    vwStep(ku.slug,"Cockpit angepasst \u2713","ok");
    return kundenlisteSchreiben(function(liste){
      liste.kunden.forEach(function(k){if(k.slug===ku.slug){k.name=f.name;k.code=f.code;k.objekt=f.objekt;if(f.abo)k.abo=f.abo;}});
      return liste;
    },"Kunde "+ku.slug+": Kundenliste aktualisiert");
  }).then(function(){
    vwStep(ku.slug,"Kundenliste aktualisiert \u2713","ok");
    ku.name=f.name;ku.code=f.code;ku.objekt=f.objekt;if(f.abo)ku.abo=f.abo;
    nkNeu.forEach(function(e){if(e.slug===ku.slug){e.name=f.name;e.code=f.code;e.objekt=f.objekt;if(f.abo)e.abo=f.abo;}});
    if(objCache[ku.slug]&&f.abo&&ABOS[f.abo]){objCache[ku.slug].settings.abo=f.abo;objCache[ku.slug].settings.limit=ABOS[f.abo].limit;}
    alert("Gespeichert \u2713\n\nWichtig: Sag Claude im Chat \u201eKunde "+f.name+" wurde ge\u00e4ndert\u201c, damit auch die KI-Zuordnung die neuen Daten kennt. Der neue Zugangscode gilt, sobald das Cockpit das n\u00e4chste Mal geladen wird.");
    render();
  })["catch"](function(err){
    vwStep(ku.slug,"Abbruch: "+err.message,"err");
    if(btn){btn.disabled=false;btn.textContent="Speichern";}
  });
}
function kundeLoeschen(ku,btn){
  if(!confirm("Kunde \u201e"+ku.name+"\u201c wirklich endg\u00fcltig l\u00f6schen?\n\nDas Cockpit und ALLE zugeh\u00f6rigen Anfragen werden aus dem System entfernt. Das kann nicht r\u00fcckg\u00e4ngig gemacht werden."))return;
  var tippe=prompt("Zur Best\u00e4tigung bitte die Kennung des Kunden eintippen:");
  if(tippe===null)return;
  if(String(tippe).trim().toLowerCase()!==ku.slug){alert("Das war nicht die Kennung \u201e"+ku.slug+"\u201c \u2014 es wurde nichts gel\u00f6scht.");return;}
  if(btn){btn.disabled=true;btn.textContent="L\u00f6sche\u2026";}
  vwStep(ku.slug,"Dateien werden ermittelt\u2026");
  ghGet(ku.slug).then(function(liste){
    if(!liste||!liste.length) return [];
    return liste;
  }).then(function(dateien){
    var kette=Promise.resolve();
    dateien.forEach(function(d){
      kette=kette.then(function(){
        return fetch(GH_API+d.path,{method:"DELETE",headers:ghHeaders(),body:JSON.stringify({message:"Kunde "+ku.slug+" gel\u00f6scht: "+d.name,sha:d.sha})}).then(function(r){if(!r.ok)throw new Error("GitHub-Fehler "+r.status+" beim L\u00f6schen von "+d.name);});
      }).then(function(){vwStep(ku.slug,d.name+" entfernt \u2713","ok");});
    });
    return kette;
  }).then(function(){
    return kundenlisteSchreiben(function(liste){
      liste.kunden=liste.kunden.filter(function(k){return k.slug!==ku.slug;});
      return liste;
    },"Kunde "+ku.slug+" aus Kundenliste entfernt");
  }).then(function(){
    state.kunden=state.kunden.filter(function(k){return k.slug!==ku.slug;});
    for(var i=nkNeu.length-1;i>=0;i--){if(nkNeu[i].slug===ku.slug)nkNeu.splice(i,1);}
    try{delete state.per[ku.slug];}catch(e){}
    alert("Kunde \u201e"+ku.name+"\u201c wurde gel\u00f6scht.\n\nLetzter Schritt: Sag Claude im Chat \u201eKunde "+ku.name+" ist gel\u00f6scht\u201c, damit die KI-Zuordnung ihn vergisst.");
    render();
  })["catch"](function(err){
    vwStep(ku.slug,"Abbruch: "+err.message,"err");
    vwStep(ku.slug,"Du kannst es einfach nochmal versuchen \u2014 bereits Gel\u00f6schtes bleibt gel\u00f6scht, der Rest wird erneut angegangen.");
    if(btn){btn.disabled=false;btn.textContent="Kunde endg\u00fcltig l\u00f6schen";}
  });
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function jget(url){return fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

function load(){
  state.loading=true; render();
  var t=Date.now();
  jget(RAW+"freigabe/kunden.json?t="+t).then(function(k){
    if(k&&k.kunden&&k.kunden.length){state.kunden=k.kunden;}
    nkNeu.forEach(function(e){
      var da=false; state.kunden.forEach(function(x){if(x.slug===e.slug)da=true;});
      if(da)return;
      var iU=-1; state.kunden.forEach(function(x,i){if(x.slug==="unklar")iU=i;});
      if(iU>=0){state.kunden.splice(iU,0,e);}else{state.kunden.push(e);}
    });
    return Promise.all(state.kunden.map(function(ku){
      return Promise.all([
        jget(RAW+ku.slug+"/pending.json?t="+t),
        jget(RAW+ku.slug+"/data.json?t="+t)
      ]).then(function(res){
        state.per[ku.slug]={
          pending:((res[0]&&res[0].anfragen)||[]).filter(function(a){return a&&a.id;}),
          live:((res[1]&&res[1].anfragen)||[]).filter(function(a){return a&&a.id;}).map(function(a){return String(a.id);})
        };
      });
    }));
  }).then(function(){state.loading=false;render();});
}

function statusOf(ku,a){
  var id=String(a.id);
  var p=state.per[ku.slug]||{live:[]};
  if(p.live.indexOf(id)>=0) return "live";
  if(state.sent[id]) return "sent";
  return "open";
}

function freigeben(ku,a,btn){
  var wh=whGet();
  if(!wh){alert("Bitte zuerst ganz unten unter „Einrichtung“ die Freigabe-Adresse eintragen.");return;}
  btn.disabled=true; btn.textContent="Wird übertragen…";
  fetch(wh+"?d="+encodeURIComponent(JSON.stringify(a))+"&slug="+encodeURIComponent(ku.slug),{mode:"no-cors"}).catch(function(){}).then(function(){
    state.sent[String(a.id)]=Date.now();
    try{localStorage.setItem("fg-sent",JSON.stringify(state.sent));}catch(e){}
    render();
    setTimeout(load,25000);
  });
}

function render(){
  var el=document.getElementById("app");
  if(!state.authed){
    el.innerHTML='<div class="gate card"><h1>Kairos Zentrale</h1><div class="sub">Bitte Zugangscode eingeben</div>'
      +'<p></p><input type="password" id="gc" placeholder="Zugangscode" autofocus>'
      +'<p></p><button class="go" id="gbtn">Öffnen</button><div class="err" id="gerr"></div></div>';
    document.getElementById("gbtn").onclick=tryGate;
    document.getElementById("gc").addEventListener("keydown",function(e){if(e.key==="Enter")tryGate();});
    return;
  }
  var h='<header><div><h1>Kairos Zentrale</h1><div class="sub">Dein Arbeitsplatz · Kunden & Freigaben</div></div>'
    +'<div class="topbtns"><button class="ghost" id="reload">↻ Aktualisieren</button></div></header>';
  if(state.loading){ el.innerHTML=h+'<div class="empty">Lade Daten…</div>'; bind(); return; }

  /* Kundenübersicht */
  h+='<p class="sect">Kunden</p><div class="kgrid">';
  state.kunden.forEach(function(ku){ h+=kundeCard(ku); });
  h+=addCard()+'</div>';

  /* Anfragen einsammeln: offen + gerade übertragen bleiben oben, nur Live wandert zu Erledigt */
  var open=[],done=[],openCnt=0;
  state.kunden.forEach(function(ku){
    var p=state.per[ku.slug]||{pending:[]};
    p.pending.forEach(function(a){
      var st=statusOf(ku,a);
      if(st==="live"){ done.push({ku:ku,a:a,st:st}); }
      else{ if(st==="open")openCnt++; open.push({ku:ku,a:a,st:st}); }
    });
  });
  open.sort(function(x,y){return Number(y.a.id)-Number(x.a.id);});
  done.sort(function(x,y){return Number(y.a.id)-Number(x.a.id);});

  h+='<p class="sect">Zu entscheiden ('+openCnt+')</p>';
  if(!open.length){ h+='<div class="empty">Nichts offen — alles entschieden.<br>Neue eingestufte Anfragen erscheinen hier automatisch.</div>'; }
  open.forEach(function(x){ h+=cardHtml(x.ku,x.a,x.st); });

  if(done.length){
    h+='<details style="border:0;margin-top:18px"><summary>Erledigt ('+done.length+')</summary>';
    done.forEach(function(x){ h+=cardHtml(x.ku,x.a,x.st); });
    h+='</details>';
  }
  h+='<div class="card" style="margin-top:22px"><details'+(whGet()?'':' open')+'><summary>⚙️ Einrichtung — Freigabe-Adresse '+(whGet()?'✓':'(fehlt!)')+'</summary>'
    +'<p class="note">Die eine Webhook-Adresse deines Freigabe-Szenarios für ALLE Kunden (beginnt mit https://hook.eu…). Sie wird nur auf diesem Gerät gespeichert.</p>'
    +'<input id="whall" placeholder="https://hook.eu…make.com/…" value="'+esc(whGet())+'">'
    +'<p></p><button class="go" id="whallsave">Speichern</button>'
    +'<p class="note" style="margin-top:18px"><b>GitHub-Schl\u00fcssel</b> \u2014 nur n\u00f6tig, damit die Zentrale neue Kunden selbst anlegen kann ('+(ghTokenGet()?'hinterlegt \u2713':'noch nicht hinterlegt')+'). Er wird nur auf diesem Ger\u00e4t gespeichert.</p>'
    +'<input id="ghtok" type="password" placeholder="github_pat_\u2026" value="'+esc(ghTokenGet())+'">'
    +'<p></p><button class="go" id="ghtoksave">Schl\u00fcssel speichern</button></details></div>';
  h+='<p class="note" style="text-align:center;margin-top:26px">Kairos Zentrale · Version 3.3</p>';
  el.innerHTML=h; bind();
}

    if(!ABOS[f.abo]){f.abo="starter";}
    if(!/^[^<>&"]{2,40}$/.test(f.name)){alert("Bitte einen Kundennamen eingeben (2\u201340 Zeichen, ohne Sonderzeichen wie < > &).");return;}
    if(!/^[a-z0-9-]{2,20}$/.test(f.slug)){alert("Die Kennung darf nur Kleinbuchstaben, Zahlen und Bindestriche enthalten (2\u201320 Zeichen).");return;}
    if(RESERVIERT.indexOf(f.slug)>=0){alert("Diese Kennung ist reserviert \u2014 bitte eine andere w\u00e4hlen.");return;}

    if(belegt){alert("Diese Kennung ist schon vergeben \u2014 bitte eine andere w\u00e4hlen.");return;}
    if(!/^[a-z\u00e4\u00f6\u00fc\u00df0-9-]{4,24}$/.test(f.code)){alert("Der Zugangscode braucht 4\u201324 Zeichen (Kleinbuchstaben/Zahlen).");return;}
    if(!/^[^<>&"]{3,80}$/.test(f.objekt)){alert("Bitte eine Objekt-Bezeichnung eingeben (3\u201380 Zeichen, ohne < > &).");return;}

      if(a) freigeben(ku,a,btn_null(b));

  });

  }
  if(el=ev.target.closest(".obj-tgl")){
    var slug2=el.getAttribute("data-slug"), oid=el.getAttribute("data-oid");
    var ku2=null; state.kunden.forEach(function(k){if(k.slug===slug2)ku2=k;});
    var stC=objCache[slug2];
    if(!ku2||!stC)return;
    var o=null; stC.objekte.forEach(function(x){if(x.id===oid)o=x;});
    if(!o)return;
    if(o.status!=="aktiv"){
      var limT=(stC.settings&&stC.settings.limit)||3;
      var aktT=stC.objekte.filter(function(x){return x.status==="aktiv";}).length;
      if(aktT>=limT){alert("Objekt-Limit erreicht — zuerst das Abo-Paket erh\u00f6hen oder ein anderes Objekt auf vermietet stellen.");return;}
    }
    el.disabled=true; el.textContent="Speichere…";
    cockpitSchreiben(slug2,function(st){
      st.objekte.forEach(function(x){if(x.id===oid)x.status=(x.status==="aktiv"?"vermietet":"aktiv");});
      return st;
    },"Kunde "+slug2+": Objekt-Status ge\u00e4ndert").then(function(st){
      objCache[slug2]=st;
      var w=document.getElementById("objwrap-"+slug2);
      if(w)w.innerHTML=objListeHtml(ku2);
    })["catch"](function(err){
      el.disabled=false; el.textContent=(o.status==="aktiv"?"Auf vermietet":"Aktivieren");
      alert("Abbruch: "+err.message+" \u2014 du kannst es einfach nochmal versuchen.");
    });
    return;
  }
  if(el=ev.target.closest(".obj-add")){
    var slug3=el.getAttribute("data-slug");
    var ku3=null; state.kunden.forEach(function(k){if(k.slug===slug3)ku3=k;});
    var stC3=objCache[slug3];
    if(!ku3||!stC3)return;
    function ov(p){var e=document.getElementById("oa-"+p+"-"+slug3);return e?clean(e.value):"";}
    var mieteRoh=document.getElementById("oa-miete-"+slug3)?document.getElementById("oa-miete-"+slug3).value:"";
    var f3={name:ov("name"),miete:Number(String(mieteRoh).replace(/[^0-9]/g,"")),dauer:ov("dauer"),krit:ov("krit"),
      scout:(document.getElementById("oa-scout-"+slug3)?document.getElementById("oa-scout-"+slug3).value:"").replace(/[^0-9a-zA-Z-]/g,""),
      iw:(document.getElementById("oa-iw-"+slug3)?document.getElementById("oa-iw-"+slug3).value:"").replace(/[^0-9a-zA-Z-]/g,"")};
    if(!/^[^<>&"]{3,80}$/.test(f3.name)){alert("Bitte eine Objekt-Bezeichnung eingeben (3\u201380 Zeichen, ohne < > &).");return;}
    if(!(f3.miete>0)){alert("Bitte die Kaltmiete als Zahl eingeben.");return;}
    var lim3=(stC3.settings&&stC3.settings.limit)||3;
    var akt3=stC3.objekte.filter(function(x){return x.status==="aktiv";}).length;
    if(akt3>=lim3){alert("Objekt-Limit erreicht \u2014 zuerst das Abo-Paket erh\u00f6hen.");return;}
    el.disabled=true; el.textContent="Lege Objekt an\u2026";
    cockpitSchreiben(slug3,function(st){
      var lim=(st.settings&&st.settings.limit)||3;
      var akt=st.objekte.filter(function(x){return x.status==="aktiv";}).length;
      if(akt>=lim) throw new Error("Objekt-Limit erreicht");
      st.objekte.push({id:objUid(),name:f3.name,miete:f3.miete,moebl:"",ab:"",dauer:f3.dauer,refImmowelt:f3.iw,refScout:f3.scout,krit:f3.krit,status:"aktiv"});
      return st;
    },"Kunde "+slug3+": Objekt angelegt").then(function(st){
      objCache[slug3]=st;
      var w=document.getElementById("objwrap-"+slug3);
      if(w)w.innerHTML=objListeHtml(ku3);
      alert("Objekt angelegt \u2713\n\nLetzter Schritt: Sag Claude im Chat \u201eNeues Objekt bei "+ku3.name+": "+f3.name+"\u201c \u2014 dann ordnet die KI eingehende Anfragen auch diesem Objekt zu.");
    })["catch"](function(err){
      el.disabled=false; el.textContent="Objekt anlegen";
      alert("Abbruch: "+err.message+" \u2014 du kannst es einfach nochmal versuchen.");
    });
    return;
  }
});

function tryGate(){
  var v=document.getElementById("gc").value.trim();
  if(v===CODE){state.authed=true;try{sessionStorage.setItem("fg-auth","1");}catch(e){} load();}
  else{document.getElementById("gerr").textContent="Code nicht korrekt — bitte erneut versuchen.";}
}

if(state.authed) load(); else render();
setInterval(function(){
  if(!state.authed||state.loading) return;
  var ae=document.activeElement;
  if(ae&&ae.closest&&(ae.closest(".nkform")||ae.id==="whall"||ae.id==="ghtok")) return;
  if(document.querySelector(".objwrap[data-loaded]")) return;
  if(document.getElementById("nk-steps")&&document.getElementById("nk-steps").style.display==="block") return;
  load();
},120000);
</script>
